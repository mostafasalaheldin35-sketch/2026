name: Build Sokhna Port 2026 Final

on:
  workflow_dispatch:
  push:
    paths:
      - 'Sokhna-Port-2026-Approved-Baseline.zip'
      - 'Sokhna-Port-2026-Changes-Bundle.tgz'
      - 'Sokhna-Port-2026-Review-Fix.tgz'
      - 'build/prepare_source.py'
      - '.github/workflows/build-final.yml'

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct verified modification bundle
        shell: pwsh
        run: |
          if(-not(Test-Path 'Sokhna-Port-2026-Changes-Bundle.tgz')){throw 'Missing Sokhna-Port-2026-Changes-Bundle.tgz'}
          $hash=(Get-FileHash 'Sokhna-Port-2026-Changes-Bundle.tgz' -Algorithm SHA256).Hash.ToLower()
          if($hash -ne '483aa71577769542ce3d88b1ba8bc1c56ba3ce2e025c90e857c65fb825819570'){throw "Changes bundle SHA mismatch: $hash"}
          tar -xzf 'Sokhna-Port-2026-Changes-Bundle.tgz' -C build
          if(-not(Test-Path 'build/apply_v2026.py')){throw 'Modification bundle extraction failed'}
          if(-not(Test-Path 'Sokhna-Port-2026-Review-Fix.tgz')){throw 'Missing Sokhna-Port-2026-Review-Fix.tgz'}
          $reviewHash=(Get-FileHash 'Sokhna-Port-2026-Review-Fix.tgz' -Algorithm SHA256).Hash.ToLower()
          if($reviewHash -ne '0442584bb65cc2bb8ce5dda212337d842382758973b0d405224577b9c802b368'){throw "Review bundle SHA mismatch: $reviewHash"}
          tar -xzf 'Sokhna-Port-2026-Review-Fix.tgz' -C build
          if(-not(Test-Path 'build/apply_review_fix.py')){throw 'Review bundle extraction failed'}

      - name: Verify approved baseline
        run: python build/prepare_source.py

      - name: Apply all approved 2026 changes
        run: python build/apply_v2026.py

      - name: Verify first-pass changes
        shell: pwsh
        run: |
          python -m py_compile buildsrc/backend.py buildsrc/launcher.py
          node --check buildsrc/app/v2026_patch.js
          python build/test_v2026.py

      - name: Apply reviewed corrections
        run: python build/apply_review_fix.py

      - name: Static and source QA
        shell: pwsh
        run: |
          python -m py_compile buildsrc/backend.py buildsrc/launcher.py
          node --check buildsrc/app/v2026_patch.js
          @'
          from pathlib import Path
          import re
          s=Path('buildsrc/app/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.I|re.S)
          Path('buildsrc/app_check.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 build/extract_inline.py
          python build/extract_inline.py
          node --check buildsrc/app_check.js
          python build/test_review_fix.py

      - name: Upload reviewed source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-source-v4.8.17.1
          path: buildsrc
          if-no-files-found: error
          retention-days: 7

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Build Windows EXE
        shell: pwsh
        run: |
          Set-Location buildsrc
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name 'Sokhna Port 2026 v4.8.17.1' --add-data 'app;app' launcher.py
          if(-not(Test-Path 'dist/Sokhna Port 2026 v4.8.17.1.exe')){throw 'EXE was not created'}
          Get-FileHash 'dist/Sokhna Port 2026 v4.8.17.1.exe' -Algorithm SHA256
          Get-Item 'dist/Sokhna Port 2026 v4.8.17.1.exe' | Format-List Name,Length,LastWriteTime

      - name: Smoke-test final EXE
        shell: pwsh
        run: |
          $qa=Join-Path $env:RUNNER_TEMP 'Sokhna2026Smoke'
          New-Item -ItemType Directory -Force $qa | Out-Null
          $exe=Resolve-Path 'buildsrc/dist/Sokhna Port 2026 v4.8.17.1.exe'
          $p=Start-Process -FilePath $exe -ArgumentList @('--data-root',$qa,'--port','18766') -PassThru
          $ok=$false
          try {
            for($i=0;$i -lt 35;$i++){
              Start-Sleep -Milliseconds 700
              try {
                $h=Invoke-RestMethod -Uri 'http://127.0.0.1:18766/api/health' -TimeoutSec 2
                if($h.ok -and $h.appVersion -eq '4.8.17.1-DESKTOP' -and $h.quickCheck -eq 'ok'){ $ok=$true; break }
              } catch {}
            }
            if(-not $ok){throw 'Final EXE health smoke test failed'}
            $app=Invoke-WebRequest -Uri 'http://127.0.0.1:18766/app/v2026_patch.js' -UseBasicParsing -TimeoutSec 3
            if($app.StatusCode -ne 200 -or $app.Content -notmatch 'fillNcrSources'){throw '2026 patch asset smoke test failed'}
          } finally {
            if($p -and -not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: Upload final EXE
        uses: actions/upload-artifact@v4
        with:
          name: Sokhna-Port-2026-Final-v4.8.17.1
          path: buildsrc/dist/Sokhna Port 2026 v4.8.17.1.exe
          if-no-files-found: error
          retention-days: 30
