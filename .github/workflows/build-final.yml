name: Build Sokhna Port 2026 Final

on:
  workflow_dispatch:
  push:
    paths:
      - 'Sokhna-Port-2026-Approved-Baseline.zip'
      - 'Sokhna-Port-2026-Changes-Bundle.tgz'
      - 'Sokhna-Port-2026-Review-Fix.tgz'
      - 'build/prepare_source.py'
      - 'build/v4172_*.b64'
      - 'build/v4173-final-scripts.b64'
      - 'build/v4174_*.b64'
      - 'build/v4175_*.b64'
      - 'build/v4175r_*.b64'
      - 'build/v4175_backend_ext.b64'
      - 'build/apply_v4175_backend_fix.py'
      - 'build/apply_v4174_cli_root_fix.py'
      - 'build/v48176_bundle_*.b64'
      - 'build/v4176local_*.b64'
      - 'build/apply_v4176_shortcut_health_fix.py'
      - 'build/apply_v48176_emergency_fix.py'
      - 'build/v4177_bundle.b64'
      - 'build/v4178_backend_ext.py'
      - 'build/apply_v4178.py'
      - 'build/test_v4178.py'
      - '.github/workflows/build-final.yml'

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct verified modification bundle
        shell: pwsh
        run: |
          if(-not(Test-Path 'Sokhna-Port-2026-Changes-Bundle.tgz')){throw 'Missing Sokhna-Port-2026-Changes-Bundle.tgz'}
          $hash=(Get-FileHash 'Sokhna-Port-2026-Changes-Bundle.tgz' -Algorithm SHA256).Hash.ToLower()
          if($hash -ne '483aa71577769542ce3d88b1ba8bc1c56ba3ce2e025c90e857c65fb825819570'){throw "Changes bundle SHA mismatch: $hash"}
          tar -xzf 'Sokhna-Port-2026-Changes-Bundle.tgz' -C build
          if(-not(Test-Path 'build/apply_v2026.py')){throw 'Modification bundle extraction failed'}
          if(-not(Test-Path 'Sokhna-Port-2026-Review-Fix.tgz')){throw 'Missing Sokhna-Port-2026-Review-Fix.tgz'}
          $reviewHash=(Get-FileHash 'Sokhna-Port-2026-Review-Fix.tgz' -Algorithm SHA256).Hash.ToLower()
          if($reviewHash -ne '0442584bb65cc2bb8ce5dda212337d842382758973b0d405224577b9c802b368'){throw "Review bundle SHA mismatch: $reviewHash"}
          tar -xzf 'Sokhna-Port-2026-Review-Fix.tgz' -C build
          if(-not(Test-Path 'build/apply_review_fix.py')){throw 'Review bundle extraction failed'}

      - name: Verify approved baseline
        run: python build/prepare_source.py

      - name: Apply all approved 2026 changes
        run: python build/apply_v2026.py

      - name: Verify first-pass changes
        shell: pwsh
        run: |
          python -m py_compile buildsrc/backend.py buildsrc/launcher.py
          node --check buildsrc/app/v2026_patch.js
          python build/test_v2026.py

      - name: Apply reviewed corrections
        run: python build/apply_review_fix.py

      - name: Reconstruct reviewed v4.8.17.2 bundle
        shell: pwsh
        run: |
          @'
          import base64, hashlib
          from pathlib import Path
          parts=sorted(Path('build').glob('v4172_*.b64'))
          if len(parts) != 17:
              raise SystemExit(f'Expected 17 v4172 chunks, got {len(parts)}')
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw=base64.b64decode(encoded, validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          expected='8b0042a21173de73cc46980bff6a8987cdf2cbc526002955137bcd4b101902d0'
          if digest != expected:
              raise SystemExit(f'v4.8.17.2 bundle SHA mismatch: {digest}')
          Path('Sokhna-Port-2026-v4.8.17.2-Reviewed-Changes.tgz').write_bytes(raw)
          print('v4.8.17.2 reviewed bundle verified:', digest)
          '@ | Set-Content -Encoding UTF8 build/reconstruct_v4172.py
          python build/reconstruct_v4172.py
          tar -xzf 'Sokhna-Port-2026-v4.8.17.2-Reviewed-Changes.tgz' -C build
          if(-not(Test-Path 'build/apply_v4172.py')){throw 'v4.8.17.2 apply script missing'}

      - name: Apply reviewed v4.8.17.2 changes
        run: python build/apply_v4172.py

      - name: Static and source QA
        shell: pwsh
        run: |
          python -m py_compile buildsrc/backend.py buildsrc/launcher.py
          node --check buildsrc/app/v2026_patch.js
          node --check buildsrc/app/v4172_patch.js
          @'
          from pathlib import Path
          import re
          s=Path('buildsrc/app/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.I|re.S)
          Path('buildsrc/app_check.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 build/extract_inline.py
          python build/extract_inline.py
          node --check buildsrc/app_check.js
          python build/test_v4172.py

      - name: Reconstruct reviewed v4.8.17.4 corrections
        shell: pwsh
        run: |
          @'
          import base64, hashlib
          from pathlib import Path
          parts=sorted(Path('build').glob('v4174_*.b64'))
          if len(parts) != 5:
              raise SystemExit(f'Expected 5 v4174 chunks, got {len(parts)}')
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw=base64.b64decode(encoded, validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          expected='9e5c22a8154dbf25606c121848d44ea82b2c5aa6ab074790fe6d87b0a86d416f'
          if digest != expected:
              raise SystemExit(f'v4.8.17.4 corrections bundle SHA mismatch: {digest}')
          Path('Sokhna-Port-v4.8.17.4-Reviewed-Corrections.tgz').write_bytes(raw)
          print('v4.8.17.4 corrections bundle verified:', digest)
          '@ | Set-Content -Encoding UTF8 build/reconstruct_v4174.py
          python build/reconstruct_v4174.py
          tar -xzf 'Sokhna-Port-v4.8.17.4-Reviewed-Corrections.tgz' -C build
          if(-not(Test-Path 'build/apply_v4174.py')){throw 'apply_v4174.py missing'}
          if(-not(Test-Path 'build/test_v4174.py')){throw 'test_v4174.py missing'}

      - name: Apply reviewed v4.8.17.4 corrections
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python build/apply_v4174.py
          if($LASTEXITCODE -ne 0){throw 'apply_v4174.py failed'}
          python build/apply_v4174_cli_root_fix.py
          if($LASTEXITCODE -ne 0){throw 'apply_v4174_cli_root_fix.py failed'}

      - name: Final v4.8.17.4 QA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile buildsrc/backend.py buildsrc/launcher.py
          node --check buildsrc/app/v2026_patch.js
          node --check buildsrc/app/v4172_patch.js
          @'
          from pathlib import Path
          import re
          s=Path('buildsrc/app/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.I|re.S)
          Path('buildsrc/app_check_final.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 build/extract_inline_final.py
          python build/extract_inline_final.py
          node --check buildsrc/app_check_final.js
          python build/test_v4174.py

      - name: Preserve clean v4.8.17.4 backend
        shell: pwsh
        run: |
          Copy-Item 'buildsrc/backend.py' 'build/v4174_backend_clean.py' -Force
          python -m py_compile build/v4174_backend_clean.py

      - name: Reconstruct final reviewed v4.8.17.5 changes
        shell: pwsh
        run: |
          @'
          import base64, hashlib
          from pathlib import Path
          parts=sorted(Path('build').glob('v4175r_*.b64'))
          if len(parts) != 5:
              raise SystemExit(f'Expected 5 v4175r chunks, got {len(parts)}')
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw=base64.b64decode(encoded, validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          expected='19794f8c65747e3b163e1627c04f444d29f03ade6d1a11581abd1eb945f9cf35'
          if digest != expected:
              raise SystemExit(f'v4.8.17.5 reviewed bundle SHA mismatch: {digest}')
          Path('Sokhna-Port-v4.8.17.5-Reviewed-Changes.tgz').write_bytes(raw)
          print('v4.8.17.5 reviewed bundle verified:', digest)
          '@ | Set-Content -Encoding UTF8 build/reconstruct_v4175r.py
          python build/reconstruct_v4175r.py
          New-Item -ItemType Directory -Force build/v4175r | Out-Null
          tar -xzf 'Sokhna-Port-v4.8.17.5-Reviewed-Changes.tgz' -C build/v4175r
          if(-not(Test-Path 'build/v4175r/apply_v4175.py')){throw 'apply_v4175.py missing'}

      - name: Apply final reviewed v4.8.17.5 changes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python build/v4175r/apply_v4175.py
          if($LASTEXITCODE -ne 0){throw 'apply_v4175.py failed'}

      - name: Install verified v4.8.17.5 backend repair
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python build/apply_v4175_backend_fix.py
          if($LASTEXITCODE -ne 0){throw 'apply_v4175_backend_fix.py failed'}
          python -m py_compile buildsrc/backend.py buildsrc/v4175_backend_ext.py

      - name: Final v4.8.17.5 QA
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile buildsrc/backend.py buildsrc/launcher.py
          node --check buildsrc/app/v2026_patch.js
          node --check buildsrc/app/v4172_patch.js
          node --check buildsrc/app/v4175_patch.js
          @'
          from pathlib import Path
          import re
          s=Path('buildsrc/app/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.I|re.S)
          Path('buildsrc/app_check_v4175.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 build/extract_inline_v4175.py
          python build/extract_inline_v4175.py
          node --check buildsrc/app_check_v4175.js
          python buildsrc/test_v4175.py

      - name: Reconstruct locally reviewed v4.8.17.6 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import base64, hashlib, tarfile
          from pathlib import Path
          parts=sorted(Path('build').glob('v4176local_*.b64'))
          if len(parts) != 6:
              raise SystemExit(f'Expected 6 v4176local chunks, got {len(parts)}')
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw=base64.b64decode(encoded, validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          expected='967f809a8911fb1c9d3ca72e963b71d8ebfcfc0278f3161db8f6830b2f4ec6b4'
          if digest != expected:
              raise SystemExit(f'local v4.8.17.6 bundle SHA mismatch: {digest}')
          archive=Path('Sokhna-Port-v4.8.17.6-Local-Reviewed.tar.xz')
          archive.write_bytes(raw)
          out=Path('build/v4176local')
          out.mkdir(parents=True,exist_ok=True)
          with tarfile.open(archive,'r:xz') as t:
              t.extractall(out)
          for required in ('apply_v4176.py','payload/test_v4176.py','payload/test_http_v4176.py','payload/test_numbering_v4176.py'):
              if not (out/required).is_file():
                  raise SystemExit(f'Missing local v4176 payload file: {required}')
          print('local v4.8.17.6 bundle verified:', digest)
          '@ | Set-Content -Encoding UTF8 build/reconstruct_v4176local.py
          python build/reconstruct_v4176local.py

      - name: Apply locally reviewed v4.8.17.6 changes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python build/v4176local/apply_v4176.py
          if($LASTEXITCODE -ne 0){throw 'apply_v4176.py failed'}

      - name: Fix v4.8.17.6 shortcut health reporting
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python build/apply_v4176_shortcut_health_fix.py
          if($LASTEXITCODE -ne 0){throw 'shortcut health fix failed'}

      - name: Final local v4.8.17.6 QA
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile buildsrc/backend.py buildsrc/launcher.py buildsrc/v4175_backend_ext.py buildsrc/v4176_backend_ext.py buildsrc/test_v4175.py buildsrc/test_v4176.py buildsrc/test_http_v4176.py buildsrc/test_numbering_v4176.py
          node --check buildsrc/app/v2026_patch.js
          node --check buildsrc/app/v4172_patch.js
          node --check buildsrc/app/v4175_patch.js
          node --check buildsrc/app/v4176_patch.js
          @'
          from pathlib import Path
          import re
          s=Path('buildsrc/app/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,flags=re.I|re.S)
          Path('buildsrc/app_check_v4176.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 build/extract_inline_v4176.py
          python build/extract_inline_v4176.py
          node --check buildsrc/app_check_v4176.js
          python buildsrc/test_v4175.py
          # v4.8.17.6 sync regression is date-sensitive; v4.8.17.7 replaces it with deterministic coverage.
          python buildsrc/test_numbering_v4176.py
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python buildsrc/test_http_v4176.py

      - name: Reconstruct reviewed v4.8.17.7 storage/sync bundle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import base64, hashlib, tarfile
          from pathlib import Path
          src=Path('build/v4177_bundle.b64')
          if not src.is_file():
              raise SystemExit('Missing build/v4177_bundle.b64')
          raw=base64.b64decode(src.read_text(encoding='utf-8').strip(), validate=True)
          digest=hashlib.sha256(raw).hexdigest()
          expected='d0e385b1fc4bb41bc17f2778e5aa9b54c1df705ace6bffe8e065ce093a364147'
          if digest != expected:
              raise SystemExit(f'v4.8.17.7 bundle SHA mismatch: {digest}')
          archive=Path('Sokhna-Port-v4.8.17.7-Storage-Sync-Reviewed.tar.xz')
          archive.write_bytes(raw)
          out=Path('build/v4177')
          out.mkdir(parents=True,exist_ok=True)
          with tarfile.open(archive,'r:xz') as t:
              t.extractall(out)
          for required in ('apply_v4177.py','v4177_backend_ext.py','test_v4177.py','app/v4177_patch.js','app/v4177_patch.css'):
              if not (out/required).is_file():
                  raise SystemExit(f'Missing v4177 payload file: {required}')
          print('v4.8.17.7 reviewed bundle verified:', digest)
          '@ | Set-Content -Encoding UTF8 build/reconstruct_v4177.py
          python build/reconstruct_v4177.py

      - name: Apply v4.8.17.7 storage backup sync consolidation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python build/v4177/apply_v4177.py
          if($LASTEXITCODE -ne 0){throw 'apply_v4177.py failed'}

      - name: Final v4.8.17.7 QA
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile buildsrc/backend.py buildsrc/launcher.py buildsrc/v4177_backend_ext.py buildsrc/test_v4177.py
          node --check buildsrc/app/v4177_patch.js
          node --check buildsrc/app/v2026_patch.js
          python buildsrc/test_numbering_v4176.py
          python buildsrc/test_v4177.py

      - name: Apply v4.8.17.8 Excel and shortcut hotfix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python build/apply_v4178.py
          if($LASTEXITCODE -ne 0){throw 'apply_v4178.py failed'}
          Copy-Item 'build/test_v4178.py' 'buildsrc/test_v4178.py' -Force

      - name: Final v4.8.17.8 QA
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: |
          $ErrorActionPreference='Stop'
          python -m py_compile buildsrc/backend.py buildsrc/launcher.py buildsrc/v4178_backend_ext.py buildsrc/test_v4178.py
          node --check buildsrc/app/v4177_patch.js
          python buildsrc/test_v4178.py

      - name: Upload reviewed source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-source-v4.8.17.8
          path: buildsrc
          if-no-files-found: error
          retention-days: 7

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller

      - name: Build Windows EXE
        shell: pwsh
        run: |
          Set-Location buildsrc
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name 'Sokhna Port 2026 v4.8.17.8' --add-data 'app;app' launcher.py
          if(-not(Test-Path 'dist/Sokhna Port 2026 v4.8.17.8.exe')){throw 'EXE was not created'}
          Get-FileHash 'dist/Sokhna Port 2026 v4.8.17.8.exe' -Algorithm SHA256
          Get-Item 'dist/Sokhna Port 2026 v4.8.17.8.exe' | Format-List Name,Length,LastWriteTime

      - name: Smoke-test final EXE
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $qaParent=Join-Path $env:RUNNER_TEMP 'Sokhna2026SmokeParent'
          New-Item -ItemType Directory -Force $qaParent | Out-Null
          $exe=Resolve-Path 'buildsrc/dist/Sokhna Port 2026 v4.8.17.8.exe'
          $p=Start-Process -FilePath $exe -ArgumentList @('--data-root',$qaParent,'--port','18766') -PassThru
          $ok=$false
          try {
            for($i=0;$i -lt 50;$i++){
              Start-Sleep -Milliseconds 700
              try {
                $h=Invoke-RestMethod -Uri 'http://127.0.0.1:18766/api/health' -TimeoutSec 2
                if($h.ok -and $h.appVersion -eq '4.8.17.8-DESKTOP' -and $h.quickCheck -eq 'ok'){ $ok=$true; break }
              } catch {}
            }
            if(-not $ok){throw 'Final EXE health smoke test failed'}
            if($h.dataRoot -notmatch 'Sokhna Port Data'){throw "Data root is not canonical: $($h.dataRoot)"}

            $index=Invoke-WebRequest -Uri 'http://127.0.0.1:18766/app/index.html' -UseBasicParsing -TimeoutSec 5
            if($index.StatusCode -ne 200 -or $index.Content -notmatch '4\.8\.17\.7-DESKTOP'){throw 'v4.8.17.7 index/version smoke failed'}
            if($index.Content -notmatch 'v4177_patch\.js' -or $index.Content -notmatch 'v4177_patch\.css'){throw 'v4.8.17.7 storage UI assets missing'}

            $sw=Invoke-WebRequest -Uri 'http://127.0.0.1:18766/app/sw.js' -UseBasicParsing -TimeoutSec 5
            if($sw.StatusCode -ne 200 -or $sw.Content -notmatch 'skipWaiting' -or $sw.Content -match 'caches\.'){throw 'Service Worker smoke failed'}
            $fav=Invoke-WebRequest -Uri 'http://127.0.0.1:18766/favicon.ico' -UseBasicParsing -TimeoutSec 5 -SkipHttpErrorCheck
            if($fav.StatusCode -ne 204){throw "favicon route should be quiet 204, got $($fav.StatusCode)"}

            $patch176=Invoke-WebRequest -Uri 'http://127.0.0.1:18766/app/v4176_patch.js' -UseBasicParsing -TimeoutSec 5
            foreach($token in @('companyItemStatusMulti','findingActualCompletionDate','reorderStore','restoreSelectedViewport')){
              if($patch176.Content -notmatch [regex]::Escape($token)){throw "local v4.8.17.6 UI token missing: $token"}
            }
            if($patch176.Content -notmatch "statusText:'مغلق'"){throw 'Closed NCR status still includes elapsed days'}

            if(-not $h.excelRoot -or -not $h.backupsRoot -or -not $h.mobileExchangeRoot){throw 'Storage roots missing from health'}
            $top=@(Get-ChildItem -LiteralPath $h.dataRoot -Directory | Select-Object -ExpandProperty Name | Sort-Object)
            if(($top -join '|') -ne 'Attachments|Backup Recovery|Database|Excel|Logs|Mobile SQL Exchange'){throw "Storage root clutter remains: $($top -join ', ')"}

            $desktop=[Environment]::GetFolderPath('Desktop')
            if(-not $desktop){throw 'Windows Desktop path unavailable'}
            $shortcut=Join-Path $desktop 'Sokhna Port.lnk'
            $fallback=Join-Path $desktop 'Sokhna Port.cmd'
            if(-not(Test-Path -LiteralPath $shortcut) -and -not(Test-Path -LiteralPath $fallback)){throw "Desktop launcher missing: $shortcut / $fallback"}
            if(Test-Path -LiteralPath $shortcut){
              $wsh=New-Object -ComObject WScript.Shell
              $lnk=$wsh.CreateShortcut($shortcut)
              if(-not $lnk.TargetPath -or -not(Test-Path -LiteralPath $lnk.TargetPath)){throw 'Desktop shortcut target invalid'}
              if([IO.Path]::GetFileName($lnk.TargetPath) -ne 'Sokhna Port.exe'){throw "Desktop shortcut points to wrong target: $($lnk.TargetPath)"}
            }

            # Seed real data so Excel validation checks content, not merely file creation.
            $now='2026-09-27T12:00:00Z'
            $seed=@(
              @{store='companies';row=@{id='c1';name='شركة اختبار EXE';companySerial=1;createdAt=$now;modifiedAt=$now}},
              @{store='items';row=@{id='i1';companyId='c1';name='رخصة التشغيل';applicable=$true;position=1;expiryDate='2027-01-01';createdAt=$now;modifiedAt=$now}},
              @{store='inspections';row=@{id='in1';companyId='c1';date='2026-09-27';inspectionCode='INS-1-2026-1';inspectionNo='INS-1-2026-1';createdAt=$now;modifiedAt=$now}},
              @{store='findings';row=@{id='f1';inspectionId='in1';companyId='c1';no='1';description='ملاحظة اختبار';requirement='متطلب';status='Open';targetDate='2026-10-01';createdAt=$now;modifiedAt=$now}}
            )
            foreach($entry in $seed){
              $body=@{store=$entry.store;row=$entry.row}|ConvertTo-Json -Depth 8 -Compress
              $put=Invoke-RestMethod -Uri 'http://127.0.0.1:18766/api/put' -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 10
              if(-not $put.ok){throw "Seed failed: $($entry.store)"}
            }

            $excel=Invoke-RestMethod -Uri 'http://127.0.0.1:18766/api/manual-recovery' -Method Post -ContentType 'application/json' -Body '{}' -TimeoutSec 45
            if(-not $excel.ok -or -not(Test-Path -LiteralPath $excel.path -PathType Container)){throw 'Manual Excel Reports package failed'}
            if(-not $excel.audit.verifiedAgainstSQLite -or $excel.audit.excelFiles -lt 1){throw 'Manual Excel SQLite audit failed'}
            $xlsx=@(Get-ChildItem -LiteralPath $excel.path -Recurse -Filter '*.xlsx' -File)
            if($xlsx.Count -lt 1){throw 'Excel Reports package contains no XLSX files'}
            foreach($x in $xlsx){if($x.Length -lt 1024){throw "Empty/invalid XLSX: $($x.FullName)"}}
            $compatPy=Join-Path $env:RUNNER_TEMP 'check_xlsx_compat.py'
            @'
            import sys, zipfile
            for p in sys.argv[1:]:
                with zipfile.ZipFile(p,'r') as z:
                    for n in z.namelist():
                        if n.startswith('xl/worksheets/sheet') and n.endswith('.xml'):
                            t=z.read(n).decode('utf-8')
                            a=t.find('<autoFilter'); m=t.find('<mergeCells')
                            if a>=0 and m>=0 and a>m:
                                raise SystemExit(f'autoFilter must precede mergeCells in EXE workbook: {p} / {n}')
            '@ | Set-Content -Encoding UTF8 $compatPy
            foreach($x in $xlsx){
              python $compatPy $x.FullName
              if($LASTEXITCODE -ne 0){throw "Excel OOXML compatibility failed: $($x.FullName)"}
            }
            $live=Invoke-RestMethod -Uri 'http://127.0.0.1:18766/api/refresh-live-excel' -Method Post -ContentType 'application/json' -Body '{}' -TimeoutSec 45
            if(-not $live.ok -or -not(Test-Path -LiteralPath $live.path)){throw 'Live Excel refresh failed'}
            if(-not $live.audit.verifiedAgainstSQLite){throw 'Live Excel SQLite audit failed'}
            if((Get-Item -LiteralPath $live.path).Length -lt 1024){throw 'Live Excel workbook is empty'}

            $repair=Invoke-RestMethod -Uri 'http://127.0.0.1:18766/api/repair-attachments' -Method Post -ContentType 'application/json' -Body '{}' -TimeoutSec 30
            if(-not $repair.ok){throw 'Attachment repair API failed'}

            $manual=Invoke-RestMethod -Uri 'http://127.0.0.1:18766/api/manual-backup' -Method Post -ContentType 'application/json' -Body '{}' -TimeoutSec 20
            if(-not $manual.ok -or -not ($manual.path -match '\.sqlite$')){throw 'Manual SQLite backup failed'}
            $body=@{path=$manual.path}|ConvertTo-Json -Compress
            $verify=Invoke-RestMethod -Uri 'http://127.0.0.1:18766/api/verify-backup' -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 15
            if(-not $verify.ok -or -not $verify.valid){throw 'Backup verification failed'}
            $preview=Invoke-RestMethod -Uri 'http://127.0.0.1:18766/api/backup-preview' -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 15
            if(-not $preview.ok){throw 'Restore preview failed'}
            $restore=Invoke-RestMethod -Uri 'http://127.0.0.1:18766/api/restore-backup' -Method Post -ContentType 'application/json' -Body $body -TimeoutSec 20
            if(-not $restore.ok -or -not(Test-Path -LiteralPath $restore.beforeRestore)){throw 'Restore / Before-Restore failed'}
            $post=Invoke-RestMethod -Uri 'http://127.0.0.1:18766/api/health' -TimeoutSec 10
            if(-not $post.ok -or $post.quickCheck -ne 'ok'){throw 'Post-restore health failed'}

            $mobile=Invoke-RestMethod -Uri 'http://127.0.0.1:18766/api/mobile-export' -Method Post -ContentType 'application/json' -Body '{"since":"","includeAttachments":false}' -TimeoutSec 45
            if(-not $mobile.ok -or -not(Test-Path -LiteralPath $mobile.path)){throw 'Mobile export failed'}
          } finally {
            if($p -and -not $p.HasExited){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}
          }

      - name: Upload final EXE
        uses: actions/upload-artifact@v4
        with:
          name: Sokhna-Port-2026-Final-v4.8.17.8
          path: buildsrc/dist/Sokhna Port 2026 v4.8.17.8.exe
          if-no-files-found: error
          retention-days: 30
