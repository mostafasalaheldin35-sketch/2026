name: Export v4.8.17.5 reviewed payload

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-v4175.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct reviewed payload
        shell: bash
        run: |
          python - <<'PY'
          import base64, tarfile
          from pathlib import Path
          parts=sorted(Path('build').glob('v4175r_*.b64'))
          raw=base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          Path('/tmp/r.tgz').write_bytes(raw)
          Path('/tmp/r').mkdir(exist_ok=True)
          with tarfile.open('/tmp/r.tgz','r:gz') as t:
              t.extractall('/tmp/r')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-v4175-payload
          path: /tmp/r
          if-no-files-found: error
          retention-days: 7
