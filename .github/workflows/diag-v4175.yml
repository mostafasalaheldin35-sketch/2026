name: Diagnose v4.8.17.5 specification

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-v4175.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract reviewed bundle and print specification
        shell: pwsh
        run: |
          @'
          import base64, tarfile, re
          from pathlib import Path
          parts=sorted(Path('build').glob('v4175r_*.b64'))
          raw=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          Path('r.tgz').write_bytes(raw)
          Path('r').mkdir(exist_ok=True)
          with tarfile.open('r.tgz','r:gz') as t: t.extractall('r')
          print('--- TEST START ---')
          _test=Path('r/payload/test_v4175.py').read_text(encoding='utf-8')
          print(_test.encode('unicode_escape').decode('ascii'))
          print('--- TEST END ---')
          js=Path('r/payload/app/v4175_patch.js').read_text(encoding='utf-8')
          print('--- API STRINGS ---')
          for x in sorted(set(re.findall(r'/api/[A-Za-z0-9_?=&./-]+',js))):
              print(x)
          print('--- BACKEND VALID PREFIX SYMBOLS ---')
          b=Path('r/payload/backend.py').read_bytes()
          try:
              s=b.decode('utf-8')
          except UnicodeDecodeError as e:
              s=b[:e.start].decode('utf-8')
              print('VALID_PREFIX_BYTES',e.start)
          for line in s.splitlines():
              if line.startswith('def ') or line.startswith('    def ') or '/api/' in line or 'backup' in line.lower() or 'restore' in line.lower():
                  print(line.encode('unicode_escape').decode('ascii'))
          '@ | Set-Content -Encoding UTF8 diag_spec.py
          python diag_spec.py
