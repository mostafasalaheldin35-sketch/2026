name: Diagnose v4.8.17.5 bundles

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-v4175.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect v4.8.17.5 bundles
        shell: pwsh
        run: |
          @'
          import base64, hashlib, tarfile, tempfile
          from pathlib import Path

          def inspect(pattern,label):
              parts=sorted(Path('build').glob(pattern))
              print(label,'PARTS',[(p.name,p.stat().st_size) for p in parts])
              encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
              try:
                  raw=base64.b64decode(encoded,validate=True)
                  mode='concat'
              except Exception as e:
                  print(label,'B64_CONCAT_ERROR',repr(e))
                  try:
                      raw=b''.join(base64.b64decode(p.read_text(encoding='utf-8').strip(),validate=True) for p in parts)
                      mode='per-part'
                  except Exception as e2:
                      print(label,'B64_PART_ERROR',repr(e2)); return
              print(label,'B64_MODE',mode)
              print(label,'BUNDLE',hashlib.sha256(raw).hexdigest(),len(raw))
              tgz=Path(label+'.tgz'); tgz.write_bytes(raw)
              out=Path(label); out.mkdir(exist_ok=True)
              try:
                  with tarfile.open(tgz,'r:gz') as t:
                      print(label,'MEMBERS',[(m.name,m.size) for m in t.getmembers()])
                      t.extractall(out)
              except Exception as e:
                  print(label,'TAR_ERROR',repr(e)); return
              candidates=list(out.rglob('backend.py'))
              if candidates:
                  b=candidates[0].read_bytes()
                  print(label,'BACKEND',candidates[0],len(b),hashlib.sha256(b).hexdigest(),'NUL',b.count(b'\0'))
                  try:
                      s=b.decode('utf-8')
                      print(label,'BACKEND_UTF8_OK',len(s))
                      compile(s,str(candidates[0]),'exec')
                      print(label,'BACKEND_COMPILE_OK')
                  except Exception as e:
                      print(label,'BACKEND_ERROR',type(e).__name__,repr(e))
              tests=list(out.rglob('test_v4175.py'))
              if tests:
                  b=tests[0].read_bytes()
                  print(label,'TEST',len(b),hashlib.sha256(b).hexdigest(),'NUL',b.count(b'\0'))
                  try:
                      compile(b.decode('utf-8'),str(tests[0]),'exec')
                      print(label,'TEST_COMPILE_OK')
                  except Exception as e:
                      print(label,'TEST_ERROR',type(e).__name__,repr(e))

          inspect('v4175_*.b64','old4175')
          inspect('v4175r_*.b64','reviewed4175')
          '@ | Set-Content -Encoding UTF8 diag_bundles.py
          python diag_bundles.py
