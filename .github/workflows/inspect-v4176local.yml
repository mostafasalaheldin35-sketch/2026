name: Inspect local v4.8.17.6 bundle

on:
  push:
    paths:
      - '.github/workflows/inspect-v4176local.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and inspect local bundle
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, tarfile
          from pathlib import Path
          parts=sorted(Path('build').glob('v4176local_*.b64'))
          print('PARTS', [p.name for p in parts])
          if len(parts) != 6:
              raise SystemExit(f'Expected 6 chunks, got {len(parts)}')
          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw=base64.b64decode(encoded, validate=True)
          print('SHA256', hashlib.sha256(raw).hexdigest())
          print('BYTES', len(raw))
          Path('/tmp/v4176local.tar.xz').write_bytes(raw)
          with tarfile.open('/tmp/v4176local.tar.xz','r:xz') as t:
              for m in t.getmembers():
                  print('MEMBER',m.name,m.size)
              t.extractall('/tmp/v4176local')
          for p in sorted(Path('/tmp/v4176local').rglob('*')):
              if p.is_file() and p.suffix.lower() in {'.py','.js','.css','.json','.txt','.md'}:
                  print('---FILE',p.relative_to('/tmp/v4176local'),'---')
                  s=p.read_text(encoding='utf-8',errors='replace')
                  print(s[:18000].encode('unicode_escape').decode('ascii'))
          PY

      - name: Export local v4.8.17.6 bundle
        uses: actions/upload-artifact@v4
        with:
          name: v4176-local-reviewed-bundle
          path: build/v4176local
          if-no-files-found: error
          retention-days: 7
