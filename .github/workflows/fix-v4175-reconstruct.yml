name: Fix v4.8.17.5 reconstruction

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-v4175-reconstruct.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch final bundle reconstruction
        shell: pwsh
        run: |
          $path='.github/workflows/build-final.yml'
          $text=Get-Content $path -Raw
          $old="          encoded=''.join(p.read_text(encoding='utf-8').strip() for p in parts)`n          raw=base64.b64decode(encoded, validate=True)`n          digest=hashlib.sha256(raw).hexdigest()`n          expected='d7d3c0a7a42425d604fd318770491e1aff1ed40c699badee5274aa709f68684b'"
          $new="          raw=b''.join(base64.b64decode(p.read_text(encoding='utf-8').strip(), validate=True) for p in parts)`n          digest=hashlib.sha256(raw).hexdigest()`n          expected='d7d3c0a7a42425d604fd318770491e1aff1ed40c699badee5274aa709f68684b'"
          if(-not $text.Contains($old)){ throw 'Target reconstruction block not found' }
          $text=$text.Replace($old,$new)
          $text=$text.TrimEnd()+"`n"
          [System.IO.File]::WriteAllText((Resolve-Path $path),$text,(New-Object System.Text.UTF8Encoding($false)))
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-final.yml
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix v4.8.17.5 chunk reconstruction"
          git push
